@if(form) {
<div [formGroup]="form">
    <input formControlName="title" value="{{note?.title}}"/>
    <textarea formControlName="content">{{note?.content}}</textarea>
    <button [disabled]="!isDirty" (click)="onSave()">Save Changes</button>
    <button (click)="delete.emit(this.note!.id)">Delete</button>
</div>
} @else {
<p>Select a note to begin.</p>
}
